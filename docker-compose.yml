# The bot: Postgres + API + n8n, plus ONE way of reaching n8n from the
# internet, picked with COMPOSE_PROFILES in .env (see docs/DEPLOY.md):
#   caddy   server with a public IP (Oracle, any VPS): HTTPS for BOT_DOMAIN
#   tunnel  laptop/PC: Cloudflare Tunnel, no open ports
#   ngrok   laptop/PC without DNS access: ngrok static domain as BOT_DOMAIN
# Only Meta's webhook path is public. The n8n editor, the API and Postgres
# listen on this machine only (use an SSH tunnel from elsewhere).
name: raps-powerplay

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB: ${N8N_DB:-n8n}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [raps]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    networks: [raps]

  n8n:
    image: n8nio/n8n:2.46.6   # the workflows are generated for this version
    restart: unless-stopped
    # WhatsApp, owner and model settings the workflows read with $env
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${BOT_DOMAIN:-localhost}
      N8N_PROTOCOL: https
      # Behind Caddy / the tunnel: trust one proxy for the client address
      N8N_PROXY_HOPS: 1
      # Default is '::', which crashes n8n where Docker has IPv6 off
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: https://${BOT_DOMAIN:-localhost}/
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      # Reachable from workflows as {{$env.RAPS_API_URL}} / {{$env.RAPS_API_KEY}}
      RAPS_API_URL: http://api:3000
      RAPS_API_KEY: ${API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes verify Meta's webhook signature with crypto
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks: [raps]

  # HTTPS front door: only /webhook/* reaches n8n, everything else is 404.
  # On a server it answers on 80/443 for BOT_DOMAIN (free certificate);
  # with the tunnel it is plain HTTP inside Docker (CADDY_SITE=:80).
  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy, tunnel]
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-${BOT_DOMAIN}}
    ports:
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [n8n]
    networks: [raps]

  # Laptop/PC: outbound tunnel to Cloudflare; BOT_DOMAIN → http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]
    networks: [raps]

  ngrok:
    image: ngrok/ngrok:3
    profiles: [ngrok]
    restart: unless-stopped
    command: ["http", "--url=${BOT_DOMAIN}", "n8n:5678"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on: [n8n]
    ports:
      - "127.0.0.1:4040:4040"
    networks: [raps]

volumes:
  pgdata:
  n8ndata:
  caddydata:

networks:
  raps:
